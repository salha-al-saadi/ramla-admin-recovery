<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعادة كلمة مرور إدارة الاحتياط | مدرسة رملة</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:#263348;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}.card{background:#fff;width:min(100%,460px);padding:30px;border-radius:20px;box-shadow:0 12px 40px #1a243218}h1{font-size:24px;color:#90364e;margin:0 0 12px}p{line-height:1.9;color:#536174}label{display:block;margin:15px 0 7px;font-weight:bold}input{width:100%;border:1px solid #cbd4e0;border-radius:9px;padding:14px;font:inherit;direction:ltr;text-align:left}button{margin-top:20px;background:#90364e;color:white;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:bold;width:100%;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.msg{margin-top:14px;line-height:1.8;white-space:pre-wrap}.error{color:#aa2634}.ok{color:#176642}.hide{display:none}small{display:block;margin-top:18px;color:#657080;line-height:1.7}</style></head><body><main class="card"><h1>إدارة الاحتياط اليومي</h1><p id="intro">استعادة كلمة مرور حساب الإدارة في مدرسة رملة أم المؤمنين (5–6).</p><section id="request"><form id="requestForm"><label for="email">البريد الإلكتروني للحساب الإداري</label><input id="email" type="email" autocomplete="email" required><button id="send" type="submit">إرسال رابط استعادة جديد</button></form></section><section id="change" class="hide"><form id="changeForm"><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">تأكيد كلمة المرور الجديدة</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button id="update" type="submit">حفظ كلمة المرور الجديدة</button></form></section><div id="msg" class="msg" role="status" aria-live="polite"></div><small>لا تشاركي رابط الاستعادة أو كلمة المرور مع أي شخص. استخدمي هذه الصفحة فقط من رابط GitHub المنشور الخاص بإدارة الاحتياط.</small></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const URL='https://sqnhlgrjcszjrzcrovmj.supabase.co',KEY='sb_publishable_oyqZ1rx1Ee3K49LoH79kFg_uD5Kk_Jr';
const $=id=>document.getElementById(id);let client=null;let recovery=false;
const isValidSupabaseURL = /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(URL.trim());
function msg(t,error=false){$('msg').textContent=t;$('msg').className='msg '+(error?'error':'ok')}
function changeMode(){recovery=true;$('request').classList.add('hide');$('change').classList.remove('hide');$('intro').textContent='أدخلي كلمة مرور جديدة لحساب إدارة الاحتياط.';msg('تم التحقق من رابط الاستعادة. يمكنك الآن تعيين كلمة مرور جديدة.')}
try{if(!isValidSupabaseURL)throw Error('عنوان اتصال Supabase غير صالح داخل الملف.');if(!KEY||!KEY.startsWith('sb_publishable_'))throw Error('مفتاح الاتصال العام غير صالح.');if(!window.supabase?.createClient)throw Error('تعذر تحميل مكتبة Supabase. تحققي من اتصال الإنترنت.');client=window.supabase.createClient(URL.trim(),KEY.trim(),{auth:{detectSessionInUrl:true,autoRefreshToken:true,persistSession:false}});client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')changeMode()});if(location.hash.includes('type=recovery')){client.auth.getSession().then(({data,error})=>{if(error)msg('تعذر التحقق من رابط الاستعادة. اطلبي رابطًا جديدًا.',true);else if(data.session)changeMode();else msg('لم يتم العثور على جلسة استعادة صالحة. اطلبي رابطًا جديدًا من الصفحة.',true)})}}catch(e){msg('تعذر تهيئة الاتصال: '+e.message,true)}
$('requestForm').addEventListener('submit',async e=>{e.preventDefault();if(!client)return msg('تعذر الاتصال بخدمة الدخول.',true);const b=$('send');b.disabled=true;msg('جارٍ إرسال رسالة الاستعادة...');try{const redirectTo=location.origin+location.pathname;if(location.protocol!=='https:')throw Error('افتحي الصفحة من رابط GitHub Pages بعد نشرها، وليس من ملف Downloads على الجهاز.');const {error}=await client.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo});if(error)throw error;msg('إذا كان البريد مسجلًا، فستصلك رسالة استعادة جديدة. افتحي الرسالة الأحدث فقط.') }catch(err){msg('تعذر إرسال الرسالة: '+err.message,true)}finally{b.disabled=false}});
$('changeForm').addEventListener('submit',async e=>{e.preventDefault();const p=$('password').value;if(p!==$('confirm').value)return msg('كلمتا المرور غير متطابقتين.',true);const b=$('update');b.disabled=true;msg('جارٍ حفظ كلمة المرور...');try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;await client.auth.signOut();$('changeForm').classList.add('hide');msg('تم تحديث كلمة المرور بنجاح. يمكنك الآن فتح نسخة مشروع الاحتياط وتسجيل الدخول بكلمة المرور الجديدة.')}catch(err){msg('تعذر تغيير كلمة المرور: '+err.message,true)}finally{b.disabled=false}});
</script></body></html>
